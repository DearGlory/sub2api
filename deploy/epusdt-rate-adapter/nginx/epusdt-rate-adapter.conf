# Include this server/location fragment in the existing HTTPS gateway server.
# The adapter itself remains bound to 127.0.0.1:18084.

location = /rates/cny.json {
    limit_except GET { deny all; }

    proxy_pass http://127.0.0.1:18084;
    proxy_http_version 1.1;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Host 127.0.0.1:18084;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 7s;
    proxy_send_timeout 2s;
    proxy_buffering off;
}

